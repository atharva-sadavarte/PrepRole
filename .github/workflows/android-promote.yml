name: PrepRole Promote Release Candidate

on:
  workflow_dispatch:
    inputs:
      target_track:
        description: 'Target track to promote Release Candidate to'
        required: true
        default: 'closed'
        type: choice
        options:
          - 'closed'
          - 'production'
      run_id:
        description: 'Workflow Run ID of the build to promote (leave blank for latest build on main)'
        required: false
        type: string
      production_rollout:
        description: 'Production rollout fraction if promoting to production (e.g. 0.1 for 10%, 1.0 for 100%)'
        required: false
        default: '0.1'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote-to-closed:
    name: Promote to Closed Testing (QA Approved)
    runs-on: ubuntu-latest
    if: inputs.target_track == 'closed'
    environment:
      name: closed-testing

    steps:
      - name: Download Release Candidate AAB
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let runId = '${{ inputs.run_id }}'.trim();

            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'android-production.yml',
                branch: 'main',
                status: 'success',
                per_page: 1
              });

              if (!runs.data.workflow_runs.length) {
                core.setFailed('No successful Android Release Pipeline runs found on main.');
                return;
              }
              runId = runs.data.workflow_runs[0].id;
              console.log(`Using latest successful run ID: ${runId}`);
            } else {
              console.log(`Using specified run ID: ${runId}`);
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const aabArtifact = artifacts.data.artifacts.find(a => a.name.startsWith('PrepRole-Release-') || a.name.includes('Android-Release'));
            if (!aabArtifact) {
              core.setFailed(`No release AAB artifact found in run ${runId}`);
              return;
            }

            console.log(`Downloading artifact: ${aabArtifact.name}`);
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: aabArtifact.id,
              archive_format: 'zip'
            });

            fs.mkdirSync('downloaded-artifact', { recursive: true });
            fs.writeFileSync('downloaded-artifact/artifact.zip', Buffer.from(download.data));

      - name: Unpack AAB artifact
        run: |
          unzip downloaded-artifact/artifact.zip -d unpacked-aab
          mkdir -p release-final
          find unpacked-aab -name "*.aab" -exec cp {} release-final/app-release.aab \;
          test -f release-final/app-release.aab
          ls -lh release-final/app-release.aab

      - name: Publish to Google Play (Closed Testing)
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.preprole
          releaseFiles: release-final/app-release.aab
          track: alpha
          status: completed

      - name: Summary
        run: |
          echo "### 🛡️ Release Candidate Promoted to Closed Testing" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** \`alpha\` (Closed Testing)" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Run ID:** \`${{ inputs.run_id || 'Latest on main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Completed" >> $GITHUB_STEP_SUMMARY

  promote-to-production:
    name: Promote to Production (Final Manual Approval)
    runs-on: ubuntu-latest
    if: inputs.target_track == 'production'
    environment:
      name: production

    steps:
      - name: Download Release Candidate AAB
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let runId = '${{ inputs.run_id }}'.trim();

            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'android-production.yml',
                branch: 'main',
                status: 'success',
                per_page: 1
              });

              if (!runs.data.workflow_runs.length) {
                core.setFailed('No successful Android Release Pipeline runs found on main.');
                return;
              }
              runId = runs.data.workflow_runs[0].id;
              console.log(`Using latest successful run ID: ${runId}`);
            } else {
              console.log(`Using specified run ID: ${runId}`);
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const aabArtifact = artifacts.data.artifacts.find(a => a.name.startsWith('PrepRole-Release-') || a.name.includes('Android-Release'));
            if (!aabArtifact) {
              core.setFailed(`No release AAB artifact found in run ${runId}`);
              return;
            }

            console.log(`Downloading artifact: ${aabArtifact.name}`);
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: aabArtifact.id,
              archive_format: 'zip'
            });

            fs.mkdirSync('downloaded-artifact', { recursive: true });
            fs.writeFileSync('downloaded-artifact/artifact.zip', Buffer.from(download.data));

      - name: Unpack AAB artifact
        run: |
          unzip downloaded-artifact/artifact.zip -d unpacked-aab
          mkdir -p release-final
          find unpacked-aab -name "*.aab" -exec cp {} release-final/app-release.aab \;
          test -f release-final/app-release.aab
          ls -lh release-final/app-release.aab

      - name: Publish to Google Play (Production)
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.preprole
          releaseFiles: release-final/app-release.aab
          track: production
          status: inProgress
          userFraction: ${{ inputs.production_rollout || '0.1' }}

      - name: Summary
        run: |
          echo "### 🌟 Release Candidate Promoted to Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Staged Rollout:** \`${{ inputs.production_rollout || '0.1' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Run ID:** \`${{ inputs.run_id || 'Latest on main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** In Progress (Rolled out to real users)" >> $GITHUB_STEP_SUMMARY
