name: PrepRole Android Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprole-production-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build AAB and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node (matches engines requirement >= 22.11.0)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Setup Java 17 (Temurin)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Decode existing keystore from secret
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          mkdir -p "$HOME/.gradle"
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      # 6. Build signed AAB
      - name: Generate Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      # 7. Verify generated AAB
      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      # 8. Save AAB as GitHub artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepRole-Android-Release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # 9. Publish to Google Play Production (10% staged rollout)
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.preprole
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: inProgress
          userFraction: 0.1
